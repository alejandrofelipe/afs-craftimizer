<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="42%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#321b78"/>
      <stop offset="100%" stop-color="#0b0921"/>
    </radialGradient>
    <linearGradient id="hg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#f9efd4"/>
      <stop offset="45%"  stop-color="#e8b84b"/>
      <stop offset="100%" stop-color="#9e5f0e"/>
    </linearGradient>
    <linearGradient id="sg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#fffde0"/>
      <stop offset="100%" stop-color="#f5a200"/>
    </linearGradient>
    <filter id="starGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hammerShadow">
      <feDropShadow dx="4" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>
  <!-- Inner highlight -->
  <ellipse cx="215" cy="190" rx="150" ry="120" fill="white" opacity="0.025" clip-path="url(#sq)"/>
  <!-- Subtle border inset -->
  <rect x="5" y="5" width="502" height="502" rx="112" ry="112" fill="none" stroke="#7050c8" stroke-width="4" opacity="0.4"/>

  <!-- Hammer -->
  <g transform="translate(256,256) rotate(-45)" filter="url(#hammerShadow)">
    <rect x="-14" y="32" width="28" height="178" rx="10" fill="url(#hg)"/>
    <ellipse cx="0" cy="208" rx="14" ry="8" fill="#7a4010"/>
    <rect x="-66" y="-96" width="132" height="104" rx="18" fill="url(#hg)"/>
    <rect x="-66" y="-96" width="132" height="26" rx="18" fill="white" opacity="0.16"/>
    <rect x="-66" y="-96" width="28"  height="104" rx="18" fill="white" opacity="0.09"/>
    <rect x="-66" y="-8"  width="132" height="7"   rx="3"  fill="#7a4010" opacity="0.38"/>
  </g>

  <!-- Star glow -->
  <circle cx="183" cy="179" r="52" fill="#f5c020" opacity="0.10"/>
  <circle cx="183" cy="179" r="32" fill="#f5c020" opacity="0.14"/>

  <!-- Star -->
  <g filter="url(#starGlow)">
    <path d="M183,144 L192,167 L218,179 L192,191 L183,214 L174,191 L148,179 L174,167 Z" fill="url(#sg)"/>
    <path d="M183,155 L189,169 L204,179 L189,189 L183,203 L177,189 L162,179 L177,169 Z" fill="white" opacity="0.42"/>
  </g>

  <!-- Sparkles -->
  <circle cx="352" cy="126" r="5.5" fill="#f5c820" opacity="0.78"/>
  <circle cx="367" cy="110" r="3.2" fill="#f5c820" opacity="0.52"/>
  <circle cx="338" cy="108" r="2.2" fill="#f5c820" opacity="0.58"/>
  <circle cx="392" cy="275" r="4"   fill="#b898f8" opacity="0.55"/>
  <circle cx="406" cy="254" r="2.4" fill="#b898f8" opacity="0.38"/>
  <circle cx="158" cy="374" r="4.2" fill="#f5c820" opacity="0.52"/>
  <circle cx="143" cy="390" r="2.5" fill="#f5c820" opacity="0.36"/>
  <circle cx="112" cy="218" r="3.2" fill="#b898f8" opacity="0.44"/>
  <circle cx="98"  cy="236" r="2"   fill="#b898f8" opacity="0.32"/>
  <circle cx="278" cy="398" r="3"   fill="#b898f8" opacity="0.38"/>
</svg>
